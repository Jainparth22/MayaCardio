[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatkeeper"
version = "1.0.0"
description = "Crash-safe, offline-first biosignal pipeline: durable capture, edge+cloud processing, provable zero silent loss"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                      # standard library only, on device and in cloud

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
beatkeeper = "beatkeeper.cli:main"
beatkeeper-cloud = "beatkeeper.cloud_server:main"
beatkeeper-sim = "beatkeeper.simulator:main"
beatkeeper-verify = "beatkeeper.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
